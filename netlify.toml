[build]
  command = "node build-market.mjs"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--frozen-lockfile --ignore-scripts --shamefully-hoist"
  MARKET_MODEL = "gpt-4.1"
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "firebase-admin"]
  included_files = ["node_modules/**"]
